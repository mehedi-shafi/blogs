# The URL the site will be built for
base_url = "https://blogs.mehedishafi.dev"
title = "shafi's blog"
theme = "terminus"

# Whether to automatically compile all Sass files in the sass directory
compile_sass = true

# Whether to build a search index to be used later on by a JavaScript library
build_search_index = true

[markdown]

[markdown.highlighting]
theme = "catppuccin-mocha"

[extra]
# Put all your custom variables here

[extra.content_security_policy]
enable = true
allowed_domains = [
    { directive = "script-src-elem", domains = ["'self'", "'unsafe-inline'"] },
    { directive = "style-src-elem", domains = ["'self'", "'unsafe-inline'"] },
    { directive = "style-src", domains = ["'self'", "'unsafe-inline'"] },
    { directive = "script-src", domains = ["'self'", "'sha256-8dejonPf5yHPanKu180y1smMgAQeuMgZishNx19IwS8='"] },
]
